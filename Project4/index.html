<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>CSS Letterforms</title>
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="background">
        <div class="letter">
            <div class="diagonal thin violet"></div>
            <div class="child thick" ></div>
            <div class="child thick"></div>
        </div>
        <div class="letter-traced">
            <div class="triangle-topleft"></div>
            <div class="triangle-bottomright" ></div>
        </div>
        <div class="letter">
            <div class="diagonal thick"></div>
            <div class="child thin violet" ></div>
            <div class="child thin violet"></div>
        </div>
        <div class="letter">
            <div class="parallelogram top"></div>
            <div class="diagonal-flat" ></div>
            <div class="parallelogram bottom"></div>
        </div>
        <div class="letter">
            <div class="child repeat"></div>
            <div class="child repeat"></div>
            <div class="child repeat"></div>
            <div class="step s0"></div>
            <div class="step s1"></div>
            <div class="step s2"></div>
            <div class="step s3"></div>
            <div class="step s4"></div>
            <div class="child repeat"></div>
            <div class="child repeat"></div>
            <div class="child repeat"></div>
        </div>
    </body>
</html>
